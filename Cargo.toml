[package]
name = "kilog"
version = "0.1.0"
edition = "2024"

[lib]
name = "kilog"
path = "src/lib.rs"

[[bin]]
name = "kilog"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "5"
eframe = "0.36.2"
egui-lucide = "0.1.0"
egui_extras = { version = "0.36.2", features = ["svg", "image", "http"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
